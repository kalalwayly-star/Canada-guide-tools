<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول القياسات - أدلة الوافدين الجدد</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calc-box { 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        .back-btn { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #002F6C; 
            font-weight: bold; 
            font-size: 14px;
        }
        h1 {
            margin-top: 0;
            color: #002F6C;
            font-size: 24px;
            border-bottom: 2px solid #F4F6F9;
            padding-bottom: 10px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 14px;
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: border-color 0.2s;
            background-color: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #002F6C;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #002F6C; 
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #001A3E;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #EBF3FC;
            border-radius: 6px;
            color: #002F6C;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="calc-box">
        <a href="#" class="back-btn">← العودة للرئيسية</a>
        <h1>محول القياسات</h1>
        
        <div class="form-group">
            <label for="amount">القيمة:</label>
            <input type="number" id="amount" placeholder="أدخل القيمة المراد تحويلها">
        </div>

        <div class="form-group">
            <label for="from-unit">من وحدة:</label>
            <select id="from-unit">
                <option value="fahrenheit">فهرنهايت (°F)</option>
                <option value="miles">ميل</option>
                <option value="pounds">رطل (باوند)</option>
                <option value="gallons">جالون</option>
            </select>
        </div>

        <div class="form-group">
            <label for="to-unit">إلى وحدة:</label>
            <select id="to-unit">
                <option value="celsius">سيليزيوس (°C)</option>
                <option value="kilometers">كيلومتر</option>
                <option value="kilograms">كيلوجرام</option>
                <option value="liters">لتر</option>
            </select>
        </div>

        <button type="button">تحويل</button>

        <div class="result-box" style="display: none;">
            النتيجة ستظهر هنا
        </div>
    </div>

</body>
</html>
