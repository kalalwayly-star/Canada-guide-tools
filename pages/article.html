<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article</title>

    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="site-header">
    <h1 id="article-title">Loading...</h1>
</header>

<main style="padding:20px;">

    <p id="article-summary"></p>

    <hr>

    <p><strong>Author:</strong> <span id="article-author"></span></p>

    <p><strong>Read Time:</strong> <span id="article-time"></span></p>

</main>
<script>
const params = new URLSearchParams(window.location.search);
const articleId = params.get("id");

fetch("../data/articles.json")
    .then(response => response.json())
    .then(articles => {

        const article = articles.find(item => item.id === articleId);

        if (!article) {
            document.getElementById("article-title").textContent = "Article Not Found";
            return;
        }

        document.getElementById("article-title").textContent = article.title;
        document.getElementById("article-summary").textContent = article.summary;
        document.getElementById("article-author").textContent = article.author;
        document.getElementById("article-time").textContent = article.readTime;

    });
</script>
</body>
</html>
