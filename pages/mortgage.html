<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Mortgage Calculator - Newcomer Guides</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .calc-box { max-width: 500px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: sans-serif; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #002F6C; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #001F4D; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-left: 5px solid #2e7d32; font-size: 18px; font-weight: bold; display: none; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #002F6C; font-weight: bold; }
        
        /* Layout direction switcher alignment styles */
        html[dir="rtl"] .lang-wrapper { text-align: left; }
        html[dir="ltr"] .lang-wrapper { text-align: right; }
        html[dir="rtl"] .result { border-left: none; border-right: 5px solid #2e7d32; }
    </style>
</head>
<body>

    <div class="calc-box">
        <!-- Language Switcher Interface Toggle -->
        <div class="lang-wrapper" style="margin-bottom: 10px;">
            <button type="button" id="lang-toggle" style="width: auto; padding: 5px 10px; background: transparent; color: #002F6C; font-size: 14px; display: inline-block; border: none; font-weight: bold;">العربية</button>
        </div>

        <a href="tools.html" class="back-btn" data-i18n="back_btn">⬅ Back to Tools</a>
        <h2 data-i18n="heading">🇨🇦 Mortgage Calculator</h2>
        
        <div class="form-group">
            <label data-i18n="label_price">Home Price ($)</label>
            <input type="number" id="home-price" value="500000">
        </div>
        <div class="form-group">
            <label data-i18n="label_downpayment">Down Payment ($)</label>
            <input type="number" id="down-payment" value="100000">
        </div>
        <div class="form-group">
            <label data-i18n="label_rate">Interest Rate (%)</label>
            <input type="number" id="mortgage-rate" value="5.0" step="0.01">
        </div>
        <div class="form-group">
            <label data-i18n="label_amortization">Amortization Period</label>
            <select id="amortization">
                <option value="25" data-i18n="opt_25">25 Years (Standard)</option>
                <option value="30" data-i18n="opt_30">30 Years</option>
                <option value="20" data-i18n="opt_20">20 Years</option>
                <option value="15" data-i18n="opt_15">15 Years</option>
            </select>
        </div>
        <button onclick="calculateMortgage()" data-i18n="btn_calculate">Calculate Monthly Payment</button>
        <div id="result" class="result">
            <span data-i18n="result_prefix">Estimated Monthly Payment:</span> <span id="output">$0.00</span>
        </div>
    </div>

    <script>
        // Dictionary definitions directly in script for instant execution safety
        const translations = {
            "en": {
                "title": "Mortgage Calculator - Newcomer Guides",
                "back_btn": "⬅ Back to Tools",
                "heading": "🇨🇦 Mortgage Calculator",
                "label_price": "Home Price ($)",
                "label_downpayment": "Down Payment ($)",
                "label_rate": "Interest Rate (%)",
                "label_amortization": "Amortization Period",
                "opt_25": "25 Years (Standard)",
                "opt_30": "30 Years",
                "opt_20": "20 Years",
                "opt_15": "15 Years",
                "btn_calculate": "Calculate Monthly Payment",
                "result_prefix": "Estimated Monthly Payment:",
                "alert_error": "Down payment cannot exceed home price."
            },
            "ar": {
                "title": "حاسبة التمويل العقاري - أدلة الوافدين الجدد",
                "back_btn": "⬅ العودة إلى الأدوات",
                "heading": "🇨🇦 حاسبة التمويل العقاري",
                "label_price": "سعر المنزل ($)",
                "label_downpayment": "الدفعة المقدمة ($)",
                "label_rate": "نسبة الفائدة (%)",
                "label_amortization": "فترة السداد (الاستهلاك)",
                "opt_25": "25 سنة (قياسي)",
                "opt_30": "30 سنة",
                "opt_20": "20 سنة",
                "opt_15": "15 سنة",
                "btn_calculate": "احسب القسط الشهري",
                "result_prefix": "القسط الشهري المتوقع:",
                "alert_error": "لا يمكن أن تتجاوز الدفعة المقدمة سعر المنزل الأساسي."
            }
        };

        let currentLang = 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('preferredLang', lang);

            // Structure configurations
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('lang-toggle').textContent = lang === 'ar' ? 'English' : 'العربية';

            // Element localization mapping
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
        }

        // Event trigger attachment
        document.getElementById('lang-toggle').addEventListener('click', () => {
            const nextLang = currentLang === 'en' ? 'ar' : 'en';
            setLanguage(nextLang);
        });

        // Initialize state properties
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang) {
                setLanguage(savedLang);
            }
        });

        // Calculation core processor logic
        function calculateMortgage() {
            const price = parseFloat(document.getElementById('home-price').value);
            const down = parseFloat(document.getElementById('down-payment').value);
            const annualRate = parseFloat(document.getElementById('mortgage-rate').value) / 100;
            const years = parseInt(document.getElementById('amortization').value);
            const principal = price - down;

            if (principal <= 0) { 
                alert(translations[currentLang]["alert_error"]); 
                return; 
            }

            // Legal Canadian Mortgage formula: Semi-annual compounding layout
            const monthlyRate = Math.pow(Math.pow(1 + annualRate / 2, 2), 1 / 12) - 1;
            const totalMonths = years * 12;
            const monthlyPayment = (principal * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -totalMonths));

            document.getElementById('output').innerText = "$" + monthlyPayment.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            document.getElementById('result').style.display = 'block';
        }
    </script>
    <script src="../assets/js/calculator-engine.js"></script>

</body>
</html>
