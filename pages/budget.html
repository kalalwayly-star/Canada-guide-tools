<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Calculator - Newcomer Guides</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calc-box { 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        .back-btn { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #002F6C; 
            font-weight: bold; 
            font-size: 14px;
        }
        h1 {
            margin-top: 0;
            color: #002F6C;
            font-size: 24px;
            border-bottom: 2px solid #F4F6F9;
            padding-bottom: 10px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 14px;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #002F6C;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #002F6C; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { 
            background: #001F4D; 
        }
        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 6px; 
            display: none; 
        }
        .success-box {
            background: #E8F5E9; 
            border-left: 5px solid #2E7D32;
            color: #1B5E20;
        }
        .danger-box {
            background: #FFEBEE; 
            border-left: 5px solid #C62828;
            color: #C62828;
        }
        .warning-box {
            background: #FFF3E0;
            border-left: 5px solid #E65100;
            color: #E65100;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-text {
            font-size: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="calc-box">
        <a href="tools.html" class="back-btn">⬅ Back to Tools</a>
        <h1>Budget Calculator 💰</h1>

        <div class="form-group">
            <label for="income">Monthly Net Income ($)</label>
            <input type="number" id="income" placeholder="e.g. 3000">
        </div>

        <div class="form-group">
            <label for="rent">Rent / Housing ($)</label>
            <input type="number" id="rent" placeholder="e.g. 1200">
        </div>

        <div class="form-group">
            <label for="food">Food & Groceries ($)</label>
            <input type="number" id="food" placeholder="e.g. 400">
        </div>

        <div class="form-group">
            <label for="transport">Transportation / Transit Pass ($)</label>
            <input type="number" id="transport" placeholder="e.g. 150">
        </div>

        <button id="calculate-btn" onclick="calculateBudget()">Calculate Remaining Balance</button>

        <div id="result" class="result-box">
            <div id="result-title" class="result-title"></div>
            <div id="result-text" class="result-text"></div>
        </div>
    </div>

    <script>
        function calculateBudget() {
            // Read raw values string values
            const incomeInput = document.getElementById('income').value.trim();
            const rentInput = document.getElementById('rent').value.trim();
            const foodInput = document.getElementById('food').value.trim();
            const transportInput = document.getElementById('transport').value.trim();

            const resultDiv = document.getElementById('result');
            const titleDiv = document.getElementById('result-title');
            const textDiv = document.getElementById('result-text');

            resultDiv.style.display = 'block';

            // Validation: Stop calculations if all fields are left completely blank
            if (!incomeInput && !rentInput && !foodInput && !transportInput) {
                resultDiv.className = "result-box warning-box";
                titleDiv.innerText = "⚠️ Missing Values";
                textDiv.innerHTML = "Please enter your monthly net income and expected expenses to calculate a summary layout.";
                return;
            }

            // Convert to clean numbers safely
            const income = parseFloat(incomeInput) || 0;
            const rent = parseFloat(rentInput) || 0;
            const food = parseFloat(foodInput) || 0;
            const transport = parseFloat(transportInput) || 0;

            const totalExpenses = rent + food + transport;
            const balance = income - totalExpenses;

            // Format monetary values with commas
            const formattedBalance = Math.abs(balance).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            const formattedExpenses = totalExpenses.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            if (balance >= 0) {
                resultDiv.className = "result-box success-box";
                titleDiv.innerText = "👍 Positive Monthly Surplus!";
                textDiv.innerHTML = `Your total expenses are <strong>$${formattedExpenses}</strong>. You have <strong>$${formattedBalance}</strong> left over this month to save or spend elsewhere.`;
            } else {
                resultDiv.className = "result-box danger-box";
                titleDiv.innerText = "⚠️ Budget Deficit Detected";
                textDiv.innerHTML = `Your total expenses are <strong>$${formattedExpenses}</strong>. You are overspending by <strong>$${formattedBalance}</strong> relative to your income. Consider reviewing housing or transit costs.`;
            }
        }
    </script>
</body>
</html>
