<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget Calculator</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <h1>Budget Calculator 💰</h1>

    <div class="tool-box">

        <label>Monthly Income</label>
        <input type="number" id="income" placeholder="e.g. 3000">

        <label>Rent</label>
        <input type="number" id="rent" placeholder="e.g. 1200">

        <label>Food</label>
        <input type="number" id="food" placeholder="e.g. 400">

        <label>Transport</label>
        <input type="number" id="transport" placeholder="e.g. 150">

        <button id="calculate-btn">Calculate</button>

        <div id="result"></div>

    </div>

    <script src="../js/budget.js"></script>

</body>
</html>
