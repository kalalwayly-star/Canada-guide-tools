<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="title">
        Newcomer Essential Checklist - Newcomers Guides & Tools
    </title>

    <meta name="description"
          content="A free newcomer checklist to help immigrants settle in Canada.">

    <!-- Main Website CSS -->
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Checklist Page CSS -->
    <link rel="stylesheet" href="assets/css/checklist.css">

</head>


<body>


<header class="top-header">

    <div class="container">


        <a href="tools.html"
           class="back-btn"
           data-i18n="back_btn">

            ⬅ Back to Tools

        </a>


        <button type="button"
                id="lang-toggle"
                class="language-btn">

            العربية

        </button>


    </div>

</header>



<main class="container">


    <!-- Title Section -->

    <section class="hero">


        <h1 data-i18n="heading">

            📋 Newcomer Essential Checklist

        </h1>


        <p data-i18n="intro">

            Complete these important settlement tasks as you begin your new life in Canada. Your progress is saved automatically.

        </p>


    </section>




    <!-- Progress Section -->


    <section class="progress-section">


        <div class="progress-header">

            <span data-i18n="progress">

                Progress

            </span>


            <span id="progressText">

                0%

            </span>


        </div>



        <div class="progress-container">

            <div id="progressBar"></div>

        </div>


    </section>





    <!-- Checklist Items Loaded From JSON -->


    <section id="checklistContainer">


        <!-- Items will be loaded from checklist.json -->


    </section>





    <!-- Action Buttons -->


    <section class="buttons">


        <button id="printBtn"
                class="secondary-btn"
                data-i18n="print_btn">

            🖨 Print Checklist

        </button>



        <button id="resetBtn"
                class="danger-btn"
                data-i18n="reset_btn">

            Reset Checklist

        </button>


    </section>



</main>





<footer class="footer">


    <p>

        © 2026 Newcomers Guides & Tools

    </p>


</footer>





<!-- Checklist JavaScript -->

<script src="assets/js/checklist.js"></script>


</body>

</html>
