<body>

<div class="checklist-box">

    <!-- Language Selector -->
    <div class="lang-wrapper" style="margin-bottom:10px;">
        <button type="button"
                id="lang-toggle"
                style="width:auto;padding:5px 10px;background:transparent;color:#002F6C;font-size:14px;border:none;font-weight:bold;cursor:pointer;">
            العربية
        </button>
    </div>

    <a href="tools.html" class="back-btn" data-i18n="back_btn">
        ⬅ Back to Tools
    </a>

    <h1 data-i18n="heading">
        📋 Newcomer Essential Checklist
    </h1>

    <p class="intro" data-i18n="intro">
        Complete these important settlement tasks as you begin your new life in Canada. Your progress is saved automatically in your browser.
    </p>

    <!-- Progress -->
    <div class="progress-container">
        <div id="progress" class="progress-bar"></div>
    </div>

    <!-- ===================== -->
    <!-- First 48 Hours -->
    <!-- ===================== -->

    <div class="section-title" data-i18n="sec_1_title">
        First 48 Hours
    </div>

    <label class="task-item">
        <input type="checkbox" id="item1" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_1_text">
            <strong>Apply for a Social Insurance Number (SIN):</strong>
            Required to work legally in Canada and access many government programs and benefits.
        </span>
    </label>

    <label class="task-item">
        <input type="checkbox" id="item2" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_2_text">
            <strong>Get a Canadian Phone Number:</strong>
            You'll need one for employers, banks, landlords, schools, healthcare providers, and government services.
        </span>
    </label>

    <!-- ===================== -->
    <!-- First 2 Weeks -->
    <!-- ===================== -->

    <div class="section-title" data-i18n="sec_2_title">
        First 2 Weeks
    </div>

    <label class="task-item">
        <input type="checkbox" id="item3" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_3_text">
            <strong>Open a Bank Account:</strong>
            Bring your identification and immigration documents to open a Canadian bank account and receive a debit card.
        </span>
    </label>

    <label class="task-item">
        <input type="checkbox" id="item4" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_4_text">
            <strong>Apply for Provincial Health Coverage:</strong>
            Register for your province's healthcare plan as soon as you're eligible. Processing times vary by province.
        </span>
    </label>

    <label class="task-item">
        <input type="checkbox" id="item5" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_5_text">
            <strong>Check Your Driver's Licence Eligibility:</strong>
            Find out whether you can exchange your foreign licence or if you'll need to complete written and road tests.
        </span>
    </label>

    <!-- ===================== -->
    <!-- First Month -->
    <!-- ===================== -->

    <div class="section-title" data-i18n="sec_3_title">
        First Month
    </div>

    <label class="task-item">
        <input type="checkbox" id="item6" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_6_text">
            <strong>Find Permanent Housing:</strong>
            Search for a rental home that fits your budget and carefully review the lease agreement before signing.
        </span>
    </label>

    <label class="task-item">
        <input type="checkbox" id="item7" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_7_text">
            <strong>Register Children for School:</strong>
            Contact your local school division or district to enroll eligible children in school.
        </span>
    </label>

    <label class="task-item">
        <input type="checkbox" id="item8" onchange="updateProgress()">
        <span class="task-text" data-i18n="item_8_text">
            <strong>Create a Canadian-Style Resume:</strong>
            Prepare a resume that follows Canadian standards and begin applying for jobs that match your skills.
        </span>
    </label>

    <button class="reset-btn"
            onclick="resetChecklist()"
            data-i18n="btn_reset">
        Reset Checklist Progress
    </button>

</div>

</body>
</html>
