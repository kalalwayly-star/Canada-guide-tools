<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement Converter - Newcomer Guides</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calc-box { 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        .back-btn { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #002F6C; 
            font-weight: bold; 
            font-size: 14px;
        }
        h1 {
            margin-top: 0;
            color: #002F6C;
            font-size: 24px;
            border-bottom: 2px solid #F4F6F9;
            padding-bottom: 10px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 14px;
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: border-color 0.2s;
            background-color: #fff;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #002F6C;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #002F6C; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { 
            background: #001F4D; 
        }
        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 6px; 
            display: none; 
            background: #e8f5e9; 
            border-left: 5px solid #2e7d32; 
            color: #1b5e20;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-text {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="calc-box">
        <a href="tools.html" class="back-btn">⬅ Back to Tools</a>
        <h1>📐 Measurement Converter</h1>
        
        <div class="form-group">
            <label for="convert-type">Conversion Type</label>
            <select id="convert-type" onchange="updateLabels()">
                <!-- Original Conversions -->
                <option value="f-to-c">Fahrenheit (°F) to Celsius (°C)</option>
                <option value="sqft-to-sqm">Square Feet (sq ft) to Square Metres (m²)</option>
                <option value="lbs-to-kg">Pounds (lbs) to Kilograms (kg)</option>
                <option value="miles-to-km">Miles to Kilometres (km)</option>
                
                <!-- New Requested Conversions -->
                <option value="m-to-cm">Metres (m) to Centimetres (cm)</option>
                <option value="cm-to-m">Centimetres (cm) to Metres (m)</option>
                <option value="in-to-mm">Inches (in) to Millimetres (mm)</option>
                <option value="mm-to-in">Millimetres (mm) to Inches (in)</option>
                <option value="ml-to-floz">Millilitres (mL) to Fluid Ounces (fl oz)</option>
                <option value="floz-to-ml">Fluid Ounces (fl oz) to Millilitres (mL)</option>
                <option value="gal-to-l">Gallons (US gal) to Litres (L)</option>
            </select>
        </div>

        <div class="form-group">
            <label id="input-label" for="convert-input">Enter Value in Fahrenheit (°F)</label>
            <input type="number" id="convert-input" value="32" step="any">
        </div>

        <button onclick="convertMeasurements()">Convert Value</button>

        <div id="result" class="result-box">
            <div class="result-title">Converted Result:</div>
            <div id="output" class="result-text">0.00</div>
        </div>
    </div>

    <script>
        // Update the input field text and default value whenever the dropdown changes
        function updateLabels() {
            const type = document.getElementById('convert-type').value;
            const label = document.getElementById('input-label');
            const input = document.getElementById('convert-input');
            
            if (type === 'f-to-c') { label.innerText = "Enter Value in Fahrenheit (°F)"; input.value = "32"; }
            else if (type === 'sqft-to-sqm') { label.innerText = "Enter Value in Square Feet (sq ft)"; input.value = "1000"; }
            else if (type === 'lbs-to-kg') { label.innerText = "Enter Value in Pounds (lbs)"; input.value = "150"; }
            else if (type === 'miles-to-km') { label.innerText = "Enter Value in Miles"; input.value = "60"; }
            
            // New targets
            else if (type === 'm-to-cm') { label.innerText = "Enter Value in Metres (m)"; input.value = "1"; }
            else if (type === 'cm-to-m') { label.innerText = "Enter Value in Centimetres (cm)"; input.value = "100"; }
            else if (type === 'in-to-mm') { label.innerText = "Enter Value in Inches (in)"; input.value = "1"; }
            else if (type === 'mm-to-in') { label.innerText = "Enter Value in Millimetres (mm)"; input.value = "25.4"; }
            else if (type === 'ml-to-floz') { label.innerText = "Enter Value in Millilitres (mL)"; input.value = "250"; }
            else if (type === 'floz-to-ml') { label.innerText = "Enter Value in Fluid Ounces (fl oz)"; input.value = "8"; }
            else if (type === 'gal-to-l') { label.innerText = "Enter Value in Gallons (US gal)"; input.value = "1"; }
        }

        // Mathematical conversion computations
        function convertMeasurements() {
            const type = document.getElementById('convert-type').value;
            const val = parseFloat(document.getElementById('convert-input').value);
            
            // Fallback for empty/invalid typing checks
            if (isNaN(val)) {
                alert("Please enter a valid numeric value.");
                return;
            }

            let result = 0; 
            let unit = "";

            // Base math execution tree
            if (type === 'f-to-c') { result = (val - 32) * 5 / 9; unit = " °C"; }
            else if (type === 'sqft-to-sqm') { result = val * 0.092903; unit = " m²"; }
            else if (type === 'lbs-to-kg') { result = val * 0.45359237; unit = " kg"; }
            else if (type === 'miles-to-km') { result = val * 1.60934; unit = " km"; }
            
            // New conversions math configurations
            else if (type === 'm-to-cm') { result = val * 100; unit = " cm"; }
            else if (type === 'cm-to-m') { result = val / 100; unit = " m"; }
            else if (type === 'in-to-mm') { result = val * 25.4; unit = " mm"; }
            else if (type === 'mm-to-in') { result = val / 25.4; unit = " in"; }
            else if (type === 'ml-to-floz') { result = val * 0.033814; unit = " fl oz"; }
            else if (type === 'floz-to-ml') { result = val / 0.033814; unit = " mL"; }
            else if (type === 'gal-to-l') { result = val * 3.78541; unit = " L"; }

            // Display results with max precision limits up to 2 decimal places
            document.getElementById('output').innerText = result.toFixed(2) + unit;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
