<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Affordability Calculator - Newcomer Guides</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .calc-box { 
            max-width: 500px; 
            margin: 40px auto; 
            padding: 30px; 
            background: #ffffff; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        .back-btn { 
            display: inline-block; 
            margin-bottom: 20px; 
            text-decoration: none; 
            color: #002F6C; 
            font-weight: bold; 
            font-size: 14px;
        }
        h1 {
            margin-top: 0;
            color: #002F6C;
            font-size: 24px;
            border-bottom: 2px solid #F4F6F9;
            padding-bottom: 10px;
        }
        p.intro {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 6px; 
            font-size: 14px;
        }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 16px; 
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #002F6C;
            outline: none;
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background: #002F6C; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { 
            background: #001F4D; 
        }
        .result-box { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 6px; 
            display: none; 
        }
        .success-box {
            background: #E8F5E9; 
            border-left: 5px solid #2E7D32;
            color: #1B5E20;
        }
        .danger-box {
            background: #FFEBEE; 
            border-left: 5px solid #C62828;
            color: #C62828;
        }
        .warning-box {
            background: #FFF3E0;
            border-left: 5px solid #E65100;
            color: #E65100;
        }
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .result-text {
            font-size: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="calc-box">
        <a href="tools.html" class="back-btn">⬅ Back to Tools</a>
        <h1>Rent Affordability Calculator 🏠</h1>
        <p class="intro">Canadian landlords generally look for renters whose monthly rent takes up 30% or less of their household income.</p>

        <div class="form-group">
            <label for="monthly-income">Total Monthly Household Income ($)</label>
            <input type="number" id="monthly-income" placeholder="e.g. 4000">
        </div>

        <div class="form-group">
            <label for="expected-rent">Expected Monthly Rent ($)</label>
            <input type="number" id="expected-rent" placeholder="e.g. 1500">
        </div>

        <button id="calculate-btn" onclick="calculateRentAffordability()">Check Affordability Status</button>

        <div id="result" class="result-box">
            <div id="result-title" class="result-title"></div>
            <div id="result-text" class="result-text"></div>
        </div>
    </div>

    <script>
        function calculateRentAffordability() {
            const incomeInput = document.getElementById('monthly-income').value.trim();
            const rentInput = document.getElementById('expected-rent').value.trim();

            const resultDiv = document.getElementById('result');
            const titleDiv = document.getElementById('result-title');
            const textDiv = document.getElementById('result-text');

            resultDiv.style.display = 'block';

            // Validation: Ensure fields aren't blank or zero
            if (!incomeInput || !rentInput || parseFloat(incomeInput) <= 0 || parseFloat(rentInput) <= 0) {
                resultDiv.className = "result-box warning-box";
                titleDiv.innerText = "⚠️ Invalid Inputs";
                textDiv.innerHTML = "Please enter positive values for both income and expected rent properties.";
                return;
            }

            const income = parseFloat(incomeInput);
            const rent = parseFloat(rentInput);

            // Calculate ratios
            const recommendedMaxRent = income * 0.30;
            const rentPercentage = (rent / income) * 100;

            const formattedRecommended = recommendedMaxRent.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            const formattedPercentage = rentPercentage.toFixed(1);

            if (rent <= recommendedMaxRent) {
                resultDiv.className = "result-box success-box";
                titleDiv.innerText = "👍 Secure & Affordable";
                textDiv.innerHTML = `This rent amounts to <strong>${formattedPercentage}%</strong> of your monthly income. It falls within the safe Canadian threshold. Your recommended maximum budget is <strong>$${formattedRecommended}</strong>.`;
            } else {
                resultDiv.className = "result-box danger-box";
                titleDiv.innerText = "⚠️ High Financial Risk";
                textDiv.innerHTML = `This rent consumes <strong>${formattedPercentage}%</strong> of your monthly income, exceeding the standard 30% baseline. Landlords might ask for a guarantor. Your recommended budget limit is <strong>$${formattedRecommended}</strong>.`;
            }
        }
    </script>
</body>
</html>
