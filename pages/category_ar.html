<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المقالات - أدلة وأدوات القادمين الجدد</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F4F6F9;
            margin: 0;
            padding: 40px 20px;
            text-align: right;
            color: #333;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #002F6C; font-weight: bold; }
        .article-card { background: #ffffff; border-radius: 12px; padding: 30px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #EAEAEA; }
        .article-title { font-size: 24px; color: #002F6C; margin: 0 0 10px 0; }
        .article-meta { font-size: 13px; color: #888; margin-bottom: 20px; display: flex; gap: 15px; }
        .article-summary { font-size: 15px; color: #555; line-height: 1.5; background-color: #F8F9FA; padding: 15px; border-right: 4px solid #002F6C; border-left: none; border-radius: 4px; margin-bottom: 20px; }
        .article-body-list { margin: 0; padding: 0; list-style: none; }
        .article-step { font-size: 15px; line-height: 1.6; color: #333; margin-bottom: 14px; padding-right: 24px; padding-left: 0; position: relative; }
        .article-step::before { content: "•"; color: #002F6C; font-weight: bold; font-size: 20px; position: absolute; right: 5px; left: auto; top: -2px; }
        .no-articles { text-align: center; padding: 40px; background: white; border-radius: 8px; color: #666; }
    </style>
</head>
<body>

    <div class="container">
        <a href="guides_ar.html" class="back-btn">⬅ العودة إلى الأدلة</a>
        <div id="articles-container">جاري تحميل المقالات...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Get the category ID from the URL (e.g., ?id=housing)
            const urlParams = new URLSearchParams(window.location.search);
            const categoryId = urlParams.get('id');

            if (!categoryId) {
                document.getElementById("articles-container").innerHTML = "<div class='no-articles'>لم يتم تحديد قسم صحيح.</div>";
                return;
            }

            // 2. Scan paths to find your Arabic articles data file safely
            const paths = ["./data/articles_ar.json", "../data/articles_ar.json"];

            function loadArticles(index) {
                if (index >= paths.length) {
                    document.getElementById("articles-container").innerHTML = "<div class='no-articles'>تعذر تحميل البيانات.</div>";
                    return;
                }

                fetch(paths[index])
                    .then(res => { if(!res.ok) throw new Error(); return res.json(); })
                    .then(articles => {
                        const container = document.getElementById("articles-container");
                        container.textContent = "";

                        // Filter articles to only show the ones matching our current category ID
                        const filteredArticles = articles.filter(art => art.category === categoryId);

                        if (filteredArticles.length === 0) {
                            container.innerHTML = "<div class='no-articles'>لا توجد مقالات متوفرة في هذا القسم حالياً.</div>";
                            return;
                        }

                        filteredArticles.forEach(art => {
                            const card = document.createElement("article");
                            card.classList.add("article-card");

                            const title = document.createElement("h2");
                            title.classList.add("article-title");
                            title.textContent = art.title;

                            const meta = document.createElement("div");
                            meta.classList.add("article-meta");
                            meta.innerHTML = `<span>✍ بقلم: ${art.author}</span> <span>⏱ مدة القراءة: ${art.readTime}</span>`;

                            const summary = document.createElement("div");
                            summary.classList.add("article-summary");
                            summary.textContent = art.summary;

                            const list = document.createElement("ul");
                            list.classList.add("article-body-list");

                            art.content.forEach(stepText => {
                                const step = document.createElement("li");
                                step.classList.add("article-step");
                                step.textContent = stepText;
                                list.appendChild(step);
                            });

                            card.appendChild(title);
                            card.appendChild(meta);
                            card.appendChild(summary);
                            card.appendChild(list);
                            container.appendChild(card);
                        });
                    })
                    .catch(() => loadArticles(index + 1));
            }
            loadArticles(0);
        });
    </script>
</body>
</html>
