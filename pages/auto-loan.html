<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Auto Loan Calculator - Newcomer Guides</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .calc-box { max-width: 500px; margin: 20px auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); font-family: sans-serif; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #002F6C; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #001F4D; }
        .result { margin-top: 20px; padding: 15px; background: #e8f5e9; border-left: 5px solid #2e7d32; font-size: 18px; font-weight: bold; display: none; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #002F6C; font-weight: bold; }
        
        /* Language Switcher Layout Helpers */
        html[dir="rtl"] .lang-wrapper { text-align: left; }
        html[dir="ltr"] .lang-wrapper { text-align: right; }
        html[dir="rtl"] .result { border-left: none; border-right: 5px solid #2e7d32; }
    </style>
</head>
<body>

    <div class="calc-box">
        <!-- Language Switcher Toggle Button -->
        <div class="lang-wrapper" style="margin-bottom: 10px;">
            <button type="button" id="lang-toggle" style="width: auto; padding: 5px 10px; background: transparent; color: #002F6C; font-size: 14px; display: inline-block; border: none; font-weight: bold; cursor: pointer;">العربية</button>
        </div>

        <a href="tools.html" class="back-btn" data-i18n="back_btn">⬅ Back to Tools</a>
        <h2 data-i18n="heading">🚗 Auto Loan Calculator</h2>
        
        <div class="form-group">
            <label data-i18n="label_price">Vehicle Price ($)</label>
            <input type="number" id="car-price" value="25000">
        </div>
        <div class="form-group">
            <label data-i18n="label_down">Down Payment / Trade-in ($)</label>
            <input type="number" id="car-down" value="5000">
        </div>
        <div class="form-group">
            <label data-i18n="label_rate">Loan Interest Rate (%)</label>
            <input type="number" id="car-rate" value="6.5" step="0.01">
        </div>
        <div class="form-group">
            <label data-i18n="label_term">Loan Term</label>
            <select id="car-term">
                <option value="60" data-i18n="opt_60">60 Months (5 Years)</option>
                <option value="72" data-i18n="opt_72">72 Months (6 Years)</option>
                <option value="48" data-i18n="opt_48">48 Months (4 Years)</option>
                <option value="36" data-i18n="opt_36">36 Months (3 Years)</option>
            </select>
        </div>
        <button onclick="calculateAutoLoan()" data-i18n="btn_calculate">Calculate Monthly Payment</button>
        <div id="result" class="result">
            <span data-i18n="result_prefix">Estimated Monthly Payment:</span> <span id="output">$0.00</span>
        </div>
    </div>
 <script>
        function calculateAutoLoan() {
            const price = parseFloat(document.getElementById('car-price').value);
            const down = parseFloat(document.getElementById('car-down').value);
            const annualRate = parseFloat(document.getElementById('car-rate').value) / 100;
            const months = parseInt(document.getElementById('car-term').value);
            const principal = price - down;

            if (principal <= 0) { alert("Down payment cannot exceed vehicle price."); return; }

            const monthlyRate = annualRate / 12;
            let monthlyPayment = monthlyRate === 0 ? (principal / months) : ((principal * monthlyRate) / (1 - Math.pow(1 + monthlyRate, -months)));

            document.getElementById('output').innerText = "$" + monthlyPayment.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            document.getElementById('result').style.display = 'block';
        }
    </script>
    
</body>
</html>
